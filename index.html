<!DOCTYPE html>
<html lang="">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="utf-8">
    
    <link rel="stylesheet" href="style/common_css.css">
    <script src="scripts/state_manage.js"></script>
    <title>Ybun's Corner</title>
  </head>
  <body>
    <div id="banner">
        <img src="assets/vectors/ybun_logo.svg" id="banner-logo">
        <!-- p>aaa</p-->
        <div id="navbar">
          <button class="navbar-button" data-state="landing">Home</button>
          <button class="navbar-button" data-state="portf">Portfolio</button>
          <button class="navbar-button" data-state="gear">Gear</button>
          <button class="navbar-button">Commissions</button>
          <button class="navbar-button">Socials</button>
        </div>
    </div>
    <div id="content"></div>
    
    
    
    
    <!-- Templates for all the different states -->
    <template id="landing">
      <link rel="stylesheet" href="style/landing_style.css">
      <div id="page-desc">
        <h2 class="desc-header">About me</h2>
        <p class="desc-content">an independant transgender musician based in Algeria, loves Open-source software and technology and art (though she can't draw)</p>
      </div>
    <iframe src=https://audius.co/embed/playlist/yboy_g41/best-of-ybun?flavor=card width="420" height="510" allow="encrypted-media" style="border: none;" id="audius-embed"></iframe>

    </template>
    <template id="portf">
      <link rel="stylesheet" href="style/portf_style.css">
      <div id="project-container">
        <div class="project-card">
          <img src="assets/images/logo_moonie.png" alt="" class="project-thumbnail" id="thumb-moonie">
          <p class="project-name project-text">MoonieMuses</p>
          <p class="project-desc project-text">YouTube channel and content creator. Specializing in the creation animated storytime cartoons and informative highly edited video essays. The topics of which can range from the likes of video games, television, movies, personal anecdotes, etc.</p>
          <div class="project-buttons">
            <a href="https://audius.co/yboy_g41/album/mooniemuses-original-soundtrack"><button class="btn" id="mm-ost">Soundtrack</button></a>
            <a href="https://www.youtube.com/@MoonieMuses"><button class="yt-btn btn">Watch on YouTube</button></a>
          </div>
        </div>
        <div class="project-card">
          <img src="assets/images/logo_ptp.png" alt="" class="project-thumbnail" id="thumb-ptp">
          <p class="project-name project-text">PopTart Pursue</p>
          <p class="project-desc project-text">A web animated show that follows 8 contestants for a prize of divine power, inspired by Cary and Michael Huang's "Battle for Dream Island"</p>
          <div class="project-buttons">
            <a href="https://youtube.com/playlist?list=PLvAPkbds9rnFf94r8wVoWfNMvPG_u79uL"><button class="btn yt-btn">Watch on YouTube</button></a>
          </div>
        </div>

      </div>
      

    </template>
    <template id="gear">
      <link rel="stylesheet" href="style/gear_style.css">
      <div id="rack-container">
        <div id="daw-rack" class="rack">
          <p class="rack-title">DAWs</p>
          <button class="rack-button">LMMS</button>
          <button class="rack-button">Reaper</button>
          <button class="rack-button">FL Studio Mobile</button>
        </div>
        <div id="plugin-rack" class="rack">
          <p class="rack-title">Plugins</p>
          <button class="rack-button">LMMS</button>
          <button class="rack-button">Reaper</button>
          <button class="rack-button">FL Studio Mobile</button>
        </div>
        <div id="sample-rack" class="rack">
          <p class="rack-title">Samples</p>
          <button class="rack-button">LMMS</button>
          <button class="rack-button">Reaper</button>
          <button class="rack-button">FL Studio Mobile</button>
        </div>
      </div>
      
      
    </template>
  </body>
</html>
