    <template id="portf">

      <div id="project-container">
        <div class="project-card">
          <img src="assets/images/logo_moonie.png" alt="" class="project-thumbnail" id="thumb-moonie">
          <p class="project-name project-text">MoonieMuses</p>
          <p class="project-desc project-text">YouTube channel and content creator. Specializing in the creation animated storytime cartoons and informative highly edited video essays. The topics of which can range from the likes of video games, television, movies, personal anecdotes, etc.</p>
          <div class="project-buttons">
            <a href="https://audius.co/yboy_g41/album/mooniemuses-original-soundtrack"><button class="btn" id="mm-ost">Soundtrack</button></a>
            <a href="https://www.youtube.com/@MoonieMuses"><button class="yt-btn btn">Watch on YouTube</button></a>
          </div>
        </div>
        <div class="project-card">
          <img src="assets/images/logo_ptp.png" alt="" class="project-thumbnail" id="thumb-ptp">
          <p class="project-name project-text">PopTart Pursue</p>
          <p class="project-desc project-text">A web animated show that follows 8 contestants for a prize of divine power, inspired by Cary and Michael Huang's "Battle for Dream Island"</p>
          <div class="project-buttons">
            <a href="https://youtube.com/playlist?list=PLvAPkbds9rnFf94r8wVoWfNMvPG_u79uL"><button class="btn yt-btn">Watch on YouTube</button></a>
          </div>
        </div>

      </div>
