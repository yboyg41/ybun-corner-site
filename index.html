        <h1 id="guides-title">Use Guidelines</h1>
        <p>These Guidelines apply to all of my original tracks (the "Music")</p>
        <ol type="I">

              <br> 
              <br> 
              This means you may share, copy, redistribute, remix, transform and build upon the Music for any purpose (commercial or otherwise), provided you give proper credit and comply with the additional restrictions in these guidelines
            </p>
          </li>

          <li>
            <h2>Attribution Requirements</h2>
            <ul>
              <li>
                <p>when using any of the Music (or any derivative material based on it), you should provide clear credit that includes at <strong>at least one</strong> of the following</p>
                <ul>
                  <li>a direct link to the original track</li>
                  <li>a link to one of my social media profiles (preferably Audius and/or Twitter/X)</li>
                </ul>
                
              </li>
              <li>
                <p>
                  Credit should be reasonably visible and accessible, mere namedropping is not sufficient to this requirement
                </p>
              </li>
              
            </ul>
          
          </li>

          <li>
            <h2>Permitted Uses</h2>
            <ul type="square">
              <p>Use in Videos, Streams, Podcasts, Games (except prohibited below) and other media is allowed, provided that all other rules in these Guidelines are followed</p>
              <p>Use in sexually explicit and NSFW content is generally permitted but <strong>prior permission is required</strong>, permission is granted or denied on a case-by-case basis depending on the nature of the content 
                <br>
                <strong>Absolutely Prohibited:</strong> any content that is lolicon, shotacon or otherwise depicts or sexualises minors (fiction or otherwise)
              </p>
            </ul>
          </li>

          <li>
            <h2>Prohibited Uses</h2>
            <p>You shall <strong>NOT</strong> use the Music (original or derivative) in:</p>
            <ul type="circle">
              <p>Hateful, propagandistic, polarising or otherwise discriminatory content, including content that promotes hatred, violence or discrimination based on race, ethnicity, religion, nationality, gender, sexual orientation, disability or similar characteristics</p>
              <p>Friday Night Funkin' mods, Osu! beatmaps or Geometry Dash levels, this ban applies to the original tracks and any derivative material</p>
            </ul>
            <p>any use that would violate applicable law is also prohibited</p>
          </li>
